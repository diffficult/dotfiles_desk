# Day time config (9am - 10pm)
# Lock after 15 minutes, suspend 10 minutes later

general {
    lock_cmd = ~/.local/bin/hypr_scripts/aerial-hyprlock.sh
    before_sleep_cmd = wlopm --off '*'
    after_sleep_cmd = wlopm --on '*'
}

listener {
    timeout = 900  # 15 minutes
    on-timeout = ~/.local/bin/hypr_scripts/aerial-hyprlock.sh
}

listener {
    timeout = 1500  # 25 minutes (15 + 10)
    # The extra dispatch is a DRM no-op (setDPMS early-returns) whose only job is
    # to clear Hyprland's internal dpmsStateOn flag. wlopm's protocol path does
    # not touch that flag, and misc:key_press_enables_dpms / mouse_move_enables_dpms
    # only wake outputs when the flag is false. Without it, once hypridle's
    # on-resume is orphaned (see docs/001), nothing can wake the monitors.
    on-timeout = wlopm --off '*' && hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = ~/.local/bin/hypr_scripts/aerial-dpms-resume.sh
}
